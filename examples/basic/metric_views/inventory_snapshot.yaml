# Rendered with templatefile(): ${catalog} is replaced by Terraform.
version: 1.1
comment: Inventory snapshot metrics (managed by Terraform)

source: ${catalog}.warehouse.fact_inventory_snapshot

joins:
  - name: product
    source: ${catalog}.warehouse.dim_product
    on: source.product_key = product.product_key
    joins:
      - name: brand_dim
        source: ${catalog}.warehouse.dim_brand
        on: product.brand = brand_dim.brand_code
  - name: location
    source: ${catalog}.warehouse.dim_location
    on: source.location_key = location.location_key

dimensions:
  - name: Snapshot Date
    expr: source.snapshot_date
  - name: Brand Code
    expr: product.brand
  - name: Brand Description
    expr: product.brand_dim.brand_description
  - name: Plant Number
    expr: location.location_number
  - name: Country Code
    expr: location.country_code

measures:
  - name: Total Stock Quantity
    expr: SUM(source.total_stock_quantity)
  - name: ATP Stock Quantity
    expr: SUM(source.available_to_promise_stock_quantity)
  - name: Product Count
    expr: COUNT(DISTINCT source.product_key)
  - name: ATP Share of Total Stock
    expr: >-
      MEASURE(`ATP Stock Quantity`) /
      NULLIF(MEASURE(`Total Stock Quantity`), 0)
